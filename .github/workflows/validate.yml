name: Validate DBabel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.9'
          - '3.11'

    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python entry points
        run: python -m py_compile scripts/*.py tests/test_*.py

      - name: Validate package contracts and manifest
        run: python scripts/check_package.py

      - name: Validate project glossary JSON
        run: python scripts/validate_glossary.py tests/fixtures/project_glossary.json

      - name: Validate project glossary CSV
        run: python scripts/validate_glossary.py tests/fixtures/project_glossary.csv

      - name: Run deterministic bilingual QA smoke test
        run: >-
          python scripts/check_bilingual_integrity.py
          tests/fixtures/bilingual_units.jsonl
          --glossary tests/fixtures/project_glossary.json
          --output "${{ runner.temp }}/dbabel-ci-qa.json"

      - name: Run progressive runtime-plan smoke test
        run: >-
          python scripts/prepare_runtime.py
          --mode LOOKUP
          --output "${{ runner.temp }}/dbabel-runtime-plan.json"

      - name: Run full regression suite
        run: python -m unittest discover -s tests -v

      - name: Validate audit report contract
        run: python scripts/validate_report.py examples/audit_report.json

      - name: Verify generated manifest is reproducible
        shell: bash
        run: |
          cp MANIFEST.sha256 /tmp/dbabel-manifest-before
          python scripts/check_package.py --write-manifest
          cmp MANIFEST.sha256 /tmp/dbabel-manifest-before

      - name: Check whitespace errors
        run: git diff --check
