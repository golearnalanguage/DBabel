<svg xmlns="http://www.w3.org/2000/svg" width="640" height="64" viewBox="0 0 640 64" role="img" aria-labelledby="title desc">
  <title id="title">DBabel platform support</title>
  <desc id="desc">DBabel runs on macOS, Windows and Linux with Python 3.9 or later.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151d31"/>
      <stop offset="1" stop-color="#0e1423"/>
    </linearGradient>
    <linearGradient id="mac-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34415f"/>
      <stop offset="1" stop-color="#202b45"/>
    </linearGradient>
    <linearGradient id="windows-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4774"/>
      <stop offset="1" stop-color="#183351"/>
    </linearGradient>
    <linearGradient id="linux-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#594a2d"/>
      <stop offset="1" stop-color="#382e22"/>
    </linearGradient>
  </defs>

  <rect x=".5" y=".5" width="639" height="63" rx="14" fill="url(#panel)" stroke="#384057"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g id="platform-macos" transform="translate(16 14)">
      <rect width="120" height="36" rx="10" fill="url(#mac-card)"/>
      <text x="60" y="16" text-anchor="middle" fill="#f6f8ff" font-size="13" font-weight="700">macOS</text>
      <text x="60" y="31" text-anchor="middle" fill="#9eabc3" font-size="10.5">desktop</text>
    </g>

    <path d="M151 14v36" stroke="#384057"/>

    <g id="platform-windows" transform="translate(164 14)">
      <rect width="138" height="36" rx="10" fill="url(#windows-card)"/>
      <text x="69" y="16" text-anchor="middle" fill="#72b7ff" font-size="13" font-weight="700">Windows</text>
      <text x="69" y="31" text-anchor="middle" fill="#9eabc3" font-size="10.5">desktop</text>
    </g>

    <path d="M317 14v36" stroke="#384057"/>

    <g id="platform-linux" transform="translate(330 14)">
      <rect width="120" height="36" rx="10" fill="url(#linux-card)"/>
      <text x="60" y="16" text-anchor="middle" fill="#f2a64c" font-size="13" font-weight="700">Linux</text>
      <text x="60" y="31" text-anchor="middle" fill="#b9a98d" font-size="10.5">desktop</text>
    </g>

    <path d="M465 14v36" stroke="#384057"/>
    <g transform="translate(485 0)">
      <text x="0" y="27" fill="#d7deed" font-size="12.5" font-weight="650">Python 3.9+</text>
      <text x="0" y="43" fill="#8e9bb5" font-size="10.5">local review workbench</text>
    </g>
  </g>
</svg>
