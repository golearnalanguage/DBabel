interface:
  display_name: "DBabel"
  short_description: "Verify database terms and review technical translations"
  default_prompt: >
    Use $dbabel-database-terminology-audit to review this document's database
    terminology and explain material changes with supporting sources. For bilingual
    changes or native-format export that require human approval, materialize a DBabel
    Review Session and route the proposed changes through Review Workbench. Never
    infer or fabricate human approval.
